spring:
  config:
    activate:
      on-profile: prod

  security:
    oauth2:
      authorizationserver:
        issuer: https://auth.suaempresa.com.br

  datasource:
    url: jdbc:postgresql://192.168.1.35:5432/casaos
    username: USER_APP_CORP
    password: USER_APP_CORP
    driver-class-name: org.postgresql.Driver

server:
  port: 8081
  servlet:
    context-path: /auth-service

logging:
  level:
    root: INFO
    org.springframework.security: WARN
