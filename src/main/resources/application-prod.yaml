spring:
  config:
    activate:
      on-profile: prod

  security:
    oauth2:
      authorizationserver:
        issuer: https://auth.suaempresa.com.br

  datasource:
    url: jdbc:sqlite:/opt/auth-service/database/auth.db
    driver-class-name: org.sqlite.JDBC

server:
  port: 8081
  servlet:
    context-path: /auth-service

logging:
  level:
    root: INFO
    org.springframework.security: WARN
