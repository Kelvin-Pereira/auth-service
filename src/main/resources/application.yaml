spring:
  application:
    name: auth-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8081/oauth2

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

security:
  jwt:
    issuer: auth-service
    accessTokenExpiration: 60
    refresh-token-expiration-days: 30
    public-key-path: classpath:keys/public.pem
    private-key-path: classpath:keys/private.pem

