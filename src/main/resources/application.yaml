spring:
  application:
    name: auth-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

security:
  jwt:
    issuer: kanban-auth
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 30
    private-key-path: keys/private.pem
    public-key-path: keys/public.pem

