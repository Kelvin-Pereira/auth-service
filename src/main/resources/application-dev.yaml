spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://192.168.1.35:5432/casaos
    username: user_app_corp_d
    password: user_app_corp_d
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        default_schema: ${app.database.schema}

server:
  port: 8081
  servlet:
    context-path: /oauth2

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  database:
    schema: corporativo_d

