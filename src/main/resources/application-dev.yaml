spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:sqlite:./database/dev/auth.db
    driver-class-name: org.sqlite.JDBC

server:
  port: 8081
  servlet:
    context-path: /oauth2

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

